[package]
name = "makeen"
version = "0.1.0"
description = "Makeen (مَكِين) - Ultra-fast, lightweight study workspace and PDF reader"
authors = ["Makeen"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
