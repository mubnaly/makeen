name: Build Windows Desktop App (Tauri)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop Executable
        run: npm run desktop:tauri

      - name: Upload Tauri Desktop Executable
        uses: actions/upload-artifact@v4
        with:
          name: Makeen-Tauri-x64
          path: release/Makeen-Tauri-x64.exe
