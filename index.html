<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Inline brand mark: no extra request, so the console stays clean and the
         tab keeps its identity in the browser and the desktop shell. -->
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="shortcut icon" href="./icon.ico" />
    <title>Makeen — مَكِين</title>
    <!-- Arabic & Latin Web Fonts for Study Annotations and UI typography (matching Makeen logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Almarai:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@500;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- The saved language is applied before the app mounts so there is no flash
         of the wrong direction. The dictionary itself lives in src/lib/i18n.js. -->
    <script>
      (function () {
        try {
          var code = localStorage.getItem('studyos.lang') === 'en' ? 'en' : 'ar';
          document.documentElement.lang = code;
          document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
          // Theme before first paint so switching palettes never flashes white.
          var themes = ['light', 'clean-white', 'sand', 'mint', 'sky', 'rose', 'dark', 'oled', 'midnight', 'forest', 'plum', 'graphite'];
          var dark = ['dark', 'oled', 'midnight', 'forest', 'plum', 'graphite'];
          var theme = localStorage.getItem('studyos.theme') || 'light';
          if (themes.indexOf(theme) === -1) theme = 'light';
          var mode = dark.indexOf(theme) >= 0 ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (e) { /* private mode: the defaults already apply */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
